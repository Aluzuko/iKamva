<article class="child-card">
  <div class="child-top">
    <app-avatar [name]="child.fullName" size="lg"></app-avatar>
    <div>
      <h3>{{ child.fullName }}</h3>
      <p *ngIf="child.yearLevel">{{ child.yearLevel }}</p>
    </div>
  </div>

  <div class="child-subjects" *ngIf="child.subjects.length">
    <app-subject-badge *ngFor="let subject of child.subjects" [name]="subject"></app-subject-badge>
  </div>

  <div class="child-stats">
    <div><strong>{{ child.upcomingCount }}</strong>Upcoming</div>
    <div><strong>{{ child.completedCount }}</strong>Completed</div>
  </div>

  <div>
    <a [routerLink]="['/parent/children', child.studentId]" class="btn btn-outline-ink btn-sm">
      View progress <i class="bi bi-chevron-right" aria-hidden="true"></i>
    </a>
  </div>
</article>

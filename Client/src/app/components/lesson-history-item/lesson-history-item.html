<div class="history-row">
  <app-avatar [name]="item.tutorName"></app-avatar>
  <div class="history-main">
    <div class="history-title">
      {{ item.subjectName }}
      <app-status-badge [text]="statusLabel" [variant]="statusVariant"></app-status-badge>
    </div>
    <div class="history-meta">
      with {{ item.tutorName }} · {{ item.scheduledAt | date: 'MMM d, y · h:mm a' }} · {{ item.durationMinutes }} min
    </div>
    <p class="history-note" *ngIf="item.notes">{{ item.notes }}</p>
  </div>
  <a
    class="btn btn-soft btn-sm"
    *ngIf="item.recordingUrl"
    [href]="item.recordingUrl"
    target="_blank"
    rel="noopener noreferrer"
  >
    <i class="bi bi-play-fill" aria-hidden="true"></i>Recording
  </a>
</div>

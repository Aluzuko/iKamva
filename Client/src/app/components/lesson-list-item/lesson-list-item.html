<div class="lesson-row">
  <app-avatar [name]="lesson.tutorName"></app-avatar>
  <div class="lesson-main">
    <div class="lesson-title">
      {{ lesson.subjectName }}
      <app-status-badge text="Upcoming" variant="info"></app-status-badge>
    </div>
    <div class="lesson-meta">
      <ng-container *ngIf="showStudentName">{{ lesson.studentName }} · </ng-container>with {{ lesson.tutorName }} ·
      {{ lesson.scheduledAt | date: 'EEE, MMM d · h:mm a' }}
    </div>
  </div>
  <div class="lesson-price">{{ lesson.price | currency: 'ZAR' : 'R' : '1.0-2' }}</div>
</div>

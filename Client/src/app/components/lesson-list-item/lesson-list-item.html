<div class="lesson-row d-flex align-items-center justify-content-between">
  <div class="d-flex align-items-center gap-3">
    <app-avatar [name]="lesson.tutorName" size="sm"></app-avatar>
    <div>
      <div class="lesson-subject">
        {{ lesson.subjectName }}
        <span class="text-muted fw-normal" *ngIf="showStudentName"> · {{ lesson.studentName }}</span>
      </div>
      <div class="lesson-meta">with {{ lesson.tutorName }} · {{ lesson.scheduledAt | date: 'medium' }}</div>
    </div>
  </div>
  <div class="lesson-price">${{ lesson.price }}</div>
</div>

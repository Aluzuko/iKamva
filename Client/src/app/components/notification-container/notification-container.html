<div class="toast-stack" role="status" aria-live="polite">
  <div class="toast-item" *ngFor="let n of notificationService.toasts()" [ngClass]="'variant-' + n.type">
    <i class="bi" [ngClass]="iconFor(n.type)" aria-hidden="true"></i>
    <div class="toast-body">
      <div class="toast-title">{{ n.title }}</div>
      <div class="toast-message">{{ n.message }}</div>
    </div>
    <button type="button" class="toast-close" (click)="dismiss(n.id)" aria-label="Dismiss">
      <i class="bi bi-x" aria-hidden="true"></i>
    </button>
  </div>
</div>

<div class="toast-stack">
  <div
    class="toast-item"
    *ngFor="let n of notificationService.notifications()"
    [class]="'variant-' + n.type"
    [hidden]="n.read"
  >
    <i class="bi" [ngClass]="iconFor(n.type)"></i>
    <div class="toast-body">
      <div class="toast-title">{{ n.title }}</div>
      <div class="toast-message">{{ n.message }}</div>
    </div>
    <button type="button" class="toast-close" (click)="dismiss(n.id)" aria-label="Dismiss">
      <i class="bi bi-x"></i>
    </button>
  </div>
</div>

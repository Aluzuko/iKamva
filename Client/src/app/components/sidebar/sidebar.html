<aside class="app-sidebar" aria-label="Main navigation">
  <div class="side-brand">
    <a class="brand-link" [routerLink]="['/', role, 'dashboard']">
      <span class="brand-mark"><i class="bi bi-book" aria-hidden="true"></i></span>
      <span class="brand-name">iKamva</span>
    </a>
    <span class="role-tag">{{ roleName }}</span>
  </div>

  <div class="side-user" *ngIf="userName">
    <app-avatar [name]="userName" size="sm"></app-avatar>
    <div>
      <small>Signed in as</small>
      <strong>{{ userName }}</strong>
    </div>
  </div>

  <nav>
    <ul class="side-nav">
      <li *ngFor="let item of navItems">
        <a
          class="side-link"
          [routerLink]="[item.route]"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          [title]="item.label"
        >
          <i class="bi" [ngClass]="item.icon" aria-hidden="true"></i>
          <span class="label">{{ item.label }}</span>
          <span class="count-badge" *ngIf="badgeFor(item) as badge">{{ badge }}<span class="sr-only"> unread</span></span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="side-foot">
    <button type="button" class="side-link" title="Sign out" (click)="session.signOut()">
      <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
      <span class="label">Sign out</span>
    </button>
  </div>
</aside>

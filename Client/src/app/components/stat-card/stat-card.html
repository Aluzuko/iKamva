<div class="stat">
  <div>
    <div class="overline">{{ label }}</div>
    <div class="stat-value">{{ value }}</div>
    <div class="stat-hint" *ngIf="trend">
      <span [class.up]="trendPositive" [class.down]="!trendPositive">
        <i class="bi" [ngClass]="trendPositive ? 'bi-arrow-up' : 'bi-arrow-down'" aria-hidden="true"></i>
        {{ trend.percent | number: '1.0-1' }}%
      </span>
      {{ trend.label }}
    </div>
    <div class="stat-hint" *ngIf="!trend && hint">{{ hint }}</div>
  </div>
  <span class="stat-icon" *ngIf="icon" [ngClass]="'tone-' + tone">
    <i class="bi" [ngClass]="icon" aria-hidden="true"></i>
  </span>
</div>

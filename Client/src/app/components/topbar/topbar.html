<div class="header-tools">
  <div class="popover-anchor" *ngIf="variant === 'full'">
    <button
      type="button"
      class="icon-round"
      [attr.aria-label]="'Notifications, ' + notificationService.unreadCount() + ' unread'"
      [attr.aria-expanded]="open() === 'notifications'"
      (click)="toggle('notifications')"
    >
      <i class="bi bi-bell" aria-hidden="true"></i>
      <span class="count-badge" *ngIf="notificationService.unreadCount() > 0">{{ notificationService.unreadCount() }}</span>
    </button>
    <div class="pop-panel" *ngIf="open() === 'notifications'">
      <div class="pop-head">
        <span>Notifications</span>
        <button
          type="button"
          class="btn btn-link btn-sm p-0 link-quiet"
          *ngIf="notificationService.unreadCount() > 0"
          (click)="notificationService.markAllAsRead()"
        >
          Mark all read
        </button>
      </div>
      <ng-container *ngIf="notificationService.notifications().length; else noNotes">
        <div class="pop-item" *ngFor="let n of notificationService.notifications()" [class.unread]="!n.read">
          <div>
            <strong>{{ n.title }}</strong>
            <div>{{ n.message }}</div>
            <small>{{ n.time }}</small>
          </div>
        </div>
      </ng-container>
      <ng-template #noNotes>
        <div class="pop-empty">You're all caught up.</div>
      </ng-template>
    </div>
  </div>

  <div class="popover-anchor" [class.avatar-slot]="variant === 'full'">
    <button
      type="button"
      class="avatar-trigger"
      aria-label="Account menu"
      [attr.aria-expanded]="open() === 'account'"
      (click)="toggle('account')"
    >
      <app-avatar [name]="userName || role" [size]="variant === 'avatar' ? 'sm' : 'md'"></app-avatar>
    </button>
    <div class="pop-panel menu-panel" *ngIf="open() === 'account'">
      <div class="menu-who">
        <strong>{{ userName }}</strong>
        <span>{{ session.user?.email }}</span>
      </div>
      <a [routerLink]="['/', role, 'profile']" (click)="open.set(null)">
        <i class="bi bi-person" aria-hidden="true"></i>Profile
      </a>
      <button type="button" (click)="session.signOut()">
        <i class="bi bi-box-arrow-right" aria-hidden="true"></i>Sign out
      </button>
    </div>
  </div>
</div>

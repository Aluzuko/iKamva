<header class="app-topbar d-flex align-items-center justify-content-between">
  <div class="d-flex align-items-center gap-2">
    <button type="button" class="icon-btn" (click)="toggleSidebar.emit()" aria-label="Toggle sidebar">
      <i class="bi bi-layout-sidebar"></i>
    </button>
  </div>

  <div class="d-flex align-items-center gap-2">
    <div class="dropdown">
      <button
        type="button"
        class="icon-btn position-relative"
        data-bs-toggle="dropdown"
        aria-expanded="false"
        aria-label="Notifications"
      >
        <i class="bi bi-bell"></i>
        <span class="notif-dot" *ngIf="notificationService.unreadCount() > 0">{{
          notificationService.unreadCount()
        }}</span>
      </button>
      <div class="dropdown-menu dropdown-menu-end notif-menu p-2">
        <div class="d-flex justify-content-between align-items-center px-2 py-1">
          <span class="fw-semibold">Notifications</span>
          <button
            type="button"
            class="btn btn-link btn-sm p-0"
            (click)="notificationService.markAllAsRead()"
          >
            Mark all read
          </button>
        </div>

        <div class="notif-list" *ngIf="notificationService.notifications().length; else noNotif">
          <div
            class="notif-item"
            *ngFor="let n of notificationService.notifications()"
            [class.unread]="!n.read"
          >
            <div
              class="notif-icon"
              [ngClass]="{
                'bg-info': n.type === 'info',
                'bg-success': n.type === 'success',
                'bg-warning': n.type === 'warning',
                'bg-danger': n.type === 'danger'
              }"
            >
              <i
                class="bi"
                [ngClass]="{
                  'bi-info-circle': n.type === 'info',
                  'bi-check-circle': n.type === 'success',
                  'bi-exclamation-triangle': n.type === 'warning',
                  'bi-x-circle': n.type === 'danger'
                }"
              ></i>
            </div>
            <div class="notif-body">
              <div class="notif-title">{{ n.title }}</div>
              <div class="notif-message">{{ n.message }}</div>
              <div class="notif-time">{{ n.time }}</div>
            </div>
          </div>
        </div>
        <ng-template #noNotif>
          <div class="empty-state text-center py-4">
            <i class="bi bi-bell-slash fs-3 text-muted"></i>
            <p class="text-muted small mb-0 mt-2">You're all caught up</p>
          </div>
        </ng-template>
      </div>
    </div>

    <div class="dropdown">
      <button
        type="button"
        class="user-chip d-flex align-items-center gap-2"
        data-bs-toggle="dropdown"
        aria-expanded="false"
      >
        <span class="avatar">{{ role.charAt(0).toUpperCase() }}</span>
        <span class="d-none d-md-inline text-capitalize fw-medium">{{ role }} User</span>
        <i class="bi bi-chevron-down small"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" href="javascript:void(0)"><i class="bi bi-person me-2"></i>Profile</a></li>
        <li><a class="dropdown-item" href="javascript:void(0)"><i class="bi bi-gear me-2"></i>Settings</a></li>
        <li><hr class="dropdown-divider" /></li>
        <li>
          <a class="dropdown-item" routerLink="/role-select"><i class="bi bi-box-arrow-left me-2"></i>Logout</a>
        </li>
      </ul>
    </div>
  </div>
</header>

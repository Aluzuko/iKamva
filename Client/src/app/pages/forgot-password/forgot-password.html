<app-auth-shell title="Reset your password" subtitle="Enter the email address for your iKamva account.">
  <form class="auth-form" *ngIf="!submitted(); else sent" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div>
      <label for="email" class="form-label">Email address</label>
      <input
        id="email"
        type="email"
        class="form-control"
        [class.is-invalid]="emailInvalid"
        formControlName="email"
        autocomplete="username"
        aria-describedby="email-error"
      />
      <div class="invalid-feedback" id="email-error" *ngIf="emailInvalid">
        Enter an email address like name&#64;example.com.
      </div>
    </div>
    <button type="submit" class="btn btn-primary-role btn-lg w-100">Send reset link</button>
  </form>

  <ng-template #sent>
    <div class="notice notice-success" role="status">
      <i class="bi bi-check-circle" aria-hidden="true"></i>
      <span>If an account exists for that email, we've sent a link to reset the password.</span>
    </div>
  </ng-template>

  <p class="auth-switch">Remembered it? <a routerLink="/login">Back to sign in</a></p>
</app-auth-shell>

<app-auth-shell
  [role]="role"
  title="Reset your password"
  subtitle="Enter the email linked to your Mentivio account"
>
  <div *ngIf="!submitted(); else successState">
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label for="email" class="auth-form-label">Email</label>
        <input
          id="email"
          type="email"
          class="form-control"
          [class.is-invalid]="emailInvalid"
          formControlName="email"
          placeholder="you@example.com"
          autocomplete="username"
        />
        <div class="invalid-feedback" *ngIf="emailInvalid">
          Enter a valid email address.
        </div>
      </div>

      <button type="submit" class="btn auth-submit-btn text-white w-100 mt-2">
        Send Reset Link
      </button>
    </form>

    <p class="text-center text-muted small mt-4 mb-0">
      Remembered your password?
      <a [routerLink]="loginLink" class="fw-semibold text-decoration-none">Back to Sign In</a>
    </p>
  </div>

  <ng-template #successState>
    <div class="auth-alert-success mb-3">
      <i class="bi bi-check-circle me-1"></i>
      If an account exists for that email, we've sent a link to reset your password.
    </div>
    <a [routerLink]="loginLink" class="btn auth-submit-btn text-white w-100">Back to Sign In</a>
  </ng-template>
</app-auth-shell>

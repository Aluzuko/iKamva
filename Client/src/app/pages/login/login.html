<app-auth-shell title="Sign in" subtitle="Use the email address and password for your account.">
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="notice notice-error" role="alert" *ngIf="errorMessage()">
      <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
      <span>{{ errorMessage() }}</span>
    </div>

    <div>
      <label for="email" class="form-label">Email address</label>
      <input
        id="email"
        type="email"
        class="form-control"
        [class.is-invalid]="invalid('email')"
        formControlName="email"
        autocomplete="username"
        aria-describedby="email-error"
      />
      <div class="invalid-feedback" id="email-error" *ngIf="invalid('email')">
        Enter an email address like name&#64;example.com.
      </div>
    </div>

    <div>
      <div class="d-flex justify-content-between align-items-baseline">
        <label for="password" class="form-label">Password</label>
        <a class="link-quiet" routerLink="/forgot-password">Forgot password?</a>
      </div>
      <input
        id="password"
        type="password"
        class="form-control"
        [class.is-invalid]="invalid('password')"
        formControlName="password"
        autocomplete="current-password"
        aria-describedby="password-error"
      />
      <div class="invalid-feedback" id="password-error" *ngIf="invalid('password')">Enter your password.</div>
    </div>

    <button type="submit" class="btn btn-primary-role btn-lg w-100 mt-1" [disabled]="submitting()">
      <span class="spinner-inline" *ngIf="submitting()" aria-hidden="true"></span>
      {{ submitting() ? 'Signing in' : 'Sign in' }}
    </button>
  </form>

  <p class="auth-switch">New to iKamva? <a routerLink="/register">Create an account</a></p>
</app-auth-shell>

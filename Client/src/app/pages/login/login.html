<app-auth-shell [role]="role" title="Welcome back" [subtitle]="'Sign in to your ' + roleLabel + ' account'">
  <div class="auth-alert-success mb-3" *ngIf="justRegistered">
    <i class="bi bi-check-circle me-1"></i>Account created — sign in to continue.
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="mb-3">
      <label for="email" class="auth-form-label">Email</label>
      <input
        id="email"
        type="email"
        class="form-control"
        [class.is-invalid]="emailInvalid"
        formControlName="email"
        placeholder="you@example.com"
        autocomplete="username"
      />
      <div class="invalid-feedback" *ngIf="emailInvalid">
        Enter a valid email address.
      </div>
    </div>

    <div class="mb-2">
      <div class="d-flex justify-content-between align-items-center">
        <label for="password" class="auth-form-label mb-0">Password</label>
        <a
          class="small text-decoration-none"
          [routerLink]="['/forgot-password']"
          [queryParams]="{ role: role }"
        >
          Forgot password?
        </a>
      </div>
      <input
        id="password"
        type="password"
        class="form-control"
        [class.is-invalid]="passwordInvalid"
        formControlName="password"
        placeholder="••••••••"
        autocomplete="current-password"
      />
      <div class="invalid-feedback" *ngIf="passwordInvalid">
        Password must be at least 6 characters.
      </div>
    </div>

    <button type="submit" class="btn auth-submit-btn text-white w-100 mt-3">
      Sign In
    </button>
  </form>

  <div class="auth-divider">or continue with</div>

  <div class="d-flex gap-2">
    <button type="button" class="social-btn google flex-fill" (click)="continueWith('google')">
      <i class="bi bi-google"></i> Google
    </button>
    <button type="button" class="social-btn facebook flex-fill" (click)="continueWith('facebook')">
      <i class="bi bi-facebook"></i> Facebook
    </button>
  </div>

  <p class="text-center text-muted small mt-4 mb-0">
    Don't have an account?
    <a [routerLink]="['/register', role]" class="fw-semibold text-decoration-none">Create one</a>
  </p>
</app-auth-shell>

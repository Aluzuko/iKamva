<app-page-header
  title="My Children"
  [subtitle]="loading() ? null : children().length + (children().length === 1 ? ' linked student' : ' linked students')"
>
  <a routerLink="/parent/link-student" class="btn btn-primary-role">
    <i class="bi bi-plus-lg" aria-hidden="true"></i><span>Link<span class="long"> Student</span></span>
  </a>
</app-page-header>

<div class="page-body">
  <div class="loading-block" role="status" *ngIf="loading()">Loading your children…</div>

  <div class="notice notice-error" role="alert" *ngIf="failed()">
    <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
    <span>We couldn't load your children. <a href="" (click)="$event.preventDefault(); load()">Try again</a></span>
  </div>

  <ng-container *ngIf="!loading() && !failed()">
    <div class="grid-3" *ngIf="children().length; else empty">
      <app-child-summary-card *ngFor="let child of children()" [child]="child"></app-child-summary-card>
    </div>
    <ng-template #empty>
      <div class="empty-block">
        <h3>No children linked yet</h3>
        <p>Link your child's account with their email or link code to follow their lessons and pay invoices.</p>
        <a routerLink="/parent/link-student" class="btn btn-primary-role mt-3">Link a student</a>
      </div>
    </ng-template>
  </ng-container>
</div>

<div *ngIf="loading()" class="text-center text-muted py-5">Loading dashboard…</div>

<div *ngIf="!loading() && dashboard() as data">
  <div class="d-flex justify-content-between align-items-start mb-4">
    <div>
      <h1 class="page-title">Family Dashboard</h1>
      <p class="page-subtitle">Manage your children's tutoring sessions</p>
    </div>
    <a routerLink="/parent/link-student" class="btn btn-primary-role">
      <i class="bi bi-plus-lg me-1"></i>Link Student
    </a>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-6 col-lg-3">
      <app-stat-card label="Children Linked" [value]="data.childrenLinked.toString()" icon="bi-people"></app-stat-card>
    </div>
    <div class="col-6 col-lg-3">
      <app-stat-card
        label="Upcoming Lessons"
        [value]="data.upcomingLessonsThisWeek.toString()"
        icon="bi-calendar-check"
      ></app-stat-card>
    </div>
    <div class="col-6 col-lg-3">
      <app-stat-card
        label="Monthly Spend"
        [value]="'$' + data.monthlySpend"
        icon="bi-credit-card"
        [trend]="{ percent: data.monthlySpendChangePercent, label: 'vs last month' }"
      ></app-stat-card>
    </div>
    <div class="col-6 col-lg-3">
      <app-stat-card
        label="Total Sessions"
        [value]="data.totalSessions.toString()"
        icon="bi-journal-bookmark"
        [trend]="{ percent: data.totalSessionsChangePercent, label: 'vs last month' }"
      ></app-stat-card>
    </div>
  </div>

  <h2 class="section-title">Your Children</h2>
  <div class="row g-3 mb-4">
    <div class="col-12 col-md-6" *ngFor="let child of data.children">
      <app-child-summary-card [child]="child"></app-child-summary-card>
    </div>
  </div>

  <div class="panel mb-4">
    <h2 class="section-title">Upcoming Lessons</h2>
    <div *ngIf="data.upcomingLessons.length; else noUpcoming">
      <app-lesson-list-item
        *ngFor="let lesson of data.upcomingLessons"
        [lesson]="lesson"
        [showStudentName]="true"
      ></app-lesson-list-item>
    </div>
    <ng-template #noUpcoming>
      <p class="text-muted mb-0">No upcoming lessons scheduled.</p>
    </ng-template>
  </div>

  <div class="panel outstanding-panel d-flex justify-content-between align-items-center" *ngIf="data.outstandingInvoice as invoice">
    <div>
      <div class="outstanding-title">Outstanding Invoice</div>
      <div class="outstanding-meta">{{ invoice.periodDescription }}</div>
    </div>
    <div class="d-flex align-items-center gap-3">
      <div class="outstanding-amount">${{ invoice.amount }}</div>
      <button type="button" class="btn btn-primary-role" (click)="payNow(invoice.invoiceId)">Pay Now</button>
    </div>
  </div>
</div>

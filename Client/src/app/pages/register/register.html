<app-auth-shell [role]="role" title="Create your account" [subtitle]="'Join Mentivio as a ' + roleLabel">
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="mb-3">
      <label for="fullName" class="auth-form-label">Full name</label>
      <input
        id="fullName"
        type="text"
        class="form-control"
        [class.is-invalid]="fieldInvalid('fullName')"
        formControlName="fullName"
        placeholder="Jane Doe"
        autocomplete="name"
      />
      <div class="invalid-feedback" *ngIf="fieldInvalid('fullName')">
        Enter your full name.
      </div>
    </div>

    <div class="mb-3">
      <label for="email" class="auth-form-label">Email</label>
      <input
        id="email"
        type="email"
        class="form-control"
        [class.is-invalid]="fieldInvalid('email')"
        formControlName="email"
        placeholder="you@example.com"
        autocomplete="username"
      />
      <div class="invalid-feedback" *ngIf="fieldInvalid('email')">
        Enter a valid email address.
      </div>
      <div class="form-text">You'll use this email to sign in — no separate username.</div>
    </div>

    <div class="mb-3">
      <label for="password" class="auth-form-label">Password</label>
      <input
        id="password"
        type="password"
        class="form-control"
        [class.is-invalid]="fieldInvalid('password')"
        formControlName="password"
        placeholder="••••••••"
        autocomplete="new-password"
      />
      <div class="invalid-feedback" *ngIf="fieldInvalid('password')">
        Password must be at least 6 characters.
      </div>
    </div>

    <div class="mb-3">
      <label for="confirmPassword" class="auth-form-label">Confirm password</label>
      <input
        id="confirmPassword"
        type="password"
        class="form-control"
        [class.is-invalid]="confirmPasswordInvalid"
        formControlName="confirmPassword"
        placeholder="••••••••"
        autocomplete="new-password"
      />
      <div class="invalid-feedback" *ngIf="confirmPasswordInvalid">
        Passwords do not match.
      </div>
    </div>

    <button type="submit" class="btn auth-submit-btn text-white w-100 mt-2">
      Create Account
    </button>
  </form>

  <div class="auth-divider">or sign up with</div>

  <div class="d-flex gap-2">
    <button type="button" class="social-btn google flex-fill" (click)="continueWith('google')">
      <i class="bi bi-google"></i> Google
    </button>
    <button type="button" class="social-btn facebook flex-fill" (click)="continueWith('facebook')">
      <i class="bi bi-facebook"></i> Facebook
    </button>
  </div>

  <p class="text-center text-muted small mt-4 mb-0">
    Already have an account?
    <a [routerLink]="['/login', role]" class="fw-semibold text-decoration-none">Sign in</a>
  </p>
</app-auth-shell>

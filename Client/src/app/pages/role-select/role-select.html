<div class="role-select-page d-flex flex-column align-items-center justify-content-center min-vh-100 px-3 py-5">
  <div class="brand-mark d-flex align-items-center justify-content-center rounded-circle mb-3">
    <i class="bi bi-journal-bookmark-fill"></i>
  </div>
  <h1 class="brand-title mb-2">Mentivio</h1>
  <p class="lead-select mb-1">Select a role to explore the platform</p>
  <p class="text-muted mb-5">Each role has its own tailored dashboard experience</p>

  <div class="row g-4 role-grid">
    <div class="col-12 col-md-6" *ngFor="let option of roles">
      <div
        class="role-card h-100"
        [ngClass]="option.gradientClass"
        role="button"
        tabindex="0"
        (click)="enterAs(option.role)"
        (keydown.enter)="enterAs(option.role)"
      >
        <div class="role-card-bar"></div>
        <div class="role-card-body">
          <div class="role-icon mb-3">
            <i class="bi" [ngClass]="option.icon"></i>
          </div>
          <h2 class="role-name">{{ option.label }}</h2>
          <p class="role-desc">{{ option.description }}</p>
          <button type="button" class="role-cta btn btn-link p-0" (click)="enterAs(option.role); $event.stopPropagation()">
            Enter as {{ option.label }} <i class="bi bi-arrow-right ms-1"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <p class="text-muted small mt-5 mb-0">© {{ currentYear }} Mentivio. All rights reserved.</p>
</div>

<app-page-header
  [title]="student()?.fullName ?? 'Student'"
  [subtitle]="subtitle"
  backLink="/parent/children"
  backLabel="My Children"
></app-page-header>

<div class="page-body">
  <div class="loading-block" role="status" *ngIf="loading()">Loading…</div>

  <div class="empty-block" *ngIf="notFound()">
    <h3>This student isn't linked to your account</h3>
    <p>They may have been unlinked, or the link is wrong.</p>
    <a routerLink="/parent/children" class="btn btn-outline-ink mt-3">Back to My Children</a>
  </div>

  <ng-container *ngIf="!loading() && student() as data">
    <div class="stats-row">
      <app-stat-card label="Upcoming" [value]="data.upcomingCount.toString()" icon="bi-calendar-check" tone="slate" hint="Booked lessons"></app-stat-card>
      <app-stat-card label="Completed" [value]="data.completedCount.toString()" icon="bi-check2-circle" tone="mint" hint="All time"></app-stat-card>
      <app-stat-card label="Subjects" [value]="data.enrolledSubjects.length.toString()" icon="bi-book" tone="teal" hint="Enrolled"></app-stat-card>
      <app-stat-card label="Avg. rating" [value]="data.avgRating ? data.avgRating.toFixed(1) : '—'" icon="bi-star" tone="yellow" hint="Given to tutors"></app-stat-card>
    </div>

    <section *ngIf="data.enrolledSubjects.length">
      <h2 class="section-title">Enrolled subjects</h2>
      <div class="d-flex flex-wrap gap-2">
        <app-subject-badge *ngFor="let subject of data.enrolledSubjects" [name]="subject"></app-subject-badge>
      </div>
    </section>

    <section class="row-list">
      <div class="row-list-head"><h2>Upcoming lessons</h2></div>
      <app-lesson-list-item *ngFor="let lesson of data.upcomingLessons" [lesson]="lesson"></app-lesson-list-item>
      <p class="row-list-empty mb-0" *ngIf="!data.upcomingLessons.length">No upcoming lessons booked.</p>
    </section>

    <section class="row-list">
      <div class="row-list-head"><h2>Lesson history and recordings</h2></div>
      <app-lesson-history-item *ngFor="let item of data.lessonHistory" [item]="item"></app-lesson-history-item>
      <p class="row-list-empty mb-0" *ngIf="!data.lessonHistory.length">No lessons yet.</p>
    </section>
  </ng-container>
</div>
